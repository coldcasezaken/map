<!doctype html>
<html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Coldcasezaken – kaartdemo</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<style>
:root{--navy:#172B4D;--red:#A52A32;--line:#D7DEE7;--muted:#68778A}
*{box-sizing:border-box}html,body,#map{margin:0;width:100%;height:100%;font-family:Arial,Helvetica,sans-serif}body{overflow:hidden}#map{position:absolute;inset:0;background:#e7e9e8}
.panel{position:absolute;z-index:1000;top:14px;left:50%;transform:translateX(-50%);width:min(800px,calc(100% - 28px));max-width:800px;background:#fffffff2;border:1px solid var(--line);border-radius:10px;padding:13px 15px;box-shadow:0 2px 12px #18345118}
.total{font-size:14px;font-weight:700;color:var(--navy);white-space:nowrap;background:#f1f4f7;border:1px solid #d7dee7;border-radius:18px;padding:6px 10px;margin-left:auto}
.row{display:grid;grid-template-columns:minmax(0,1fr) 130px;gap:8px}.row input,.row select{width:100%;min-width:0;height:42px;border:1px solid var(--line);border-radius:6px;background:#fff;padding:0 11px;font:14px Arial;color:var(--navy)}
.cats{display:flex;flex-wrap:wrap;align-items:center;gap:7px;overflow:visible;margin-top:9px;padding-bottom:2px}.cat{height:35px;white-space:nowrap;border:1px solid var(--line);border-radius:18px;background:#fff;padding:0 11px;color:#263A57;font:12px Arial;cursor:pointer;flex:0 0 auto}.cat.active{border-color:var(--red);background:var(--red);color:#fff;font-weight:700}.cat.active .dot{background:#fff}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--red);margin-right:6px;flex:0 0 auto}.cat .n{color:#172B4D;font-weight:700;margin-left:3px}.cat.active .n{color:#fff}
.count{display:none}
/* Exact cluster palette and dimensions from the live Cold Case map */
#map .leaflet-tile{filter:grayscale(1) saturate(.18) brightness(1.06)}
#map .marker-cluster{background:transparent!important;border:0!important}
#map .marker-cluster div{color:#fff!important;font-weight:600!important;border-radius:50%!important;border:1px solid rgba(34,69,118,.25)!important;box-shadow:0 0 0 6px rgba(34,69,118,.12)!important;text-align:center!important;box-sizing:border-box}
#map .cluster-small div{background:rgba(111,137,167,.60)!important;width:38px!important;height:38px!important;line-height:36px!important}
#map .cluster-medium div{background:rgba(82,116,154,.60)!important;width:50px!important;height:50px!important;line-height:48px!important}
#map .cluster-large div{background:rgba(55,98,141,.60)!important;width:65px!important;height:65px!important;line-height:63px!important}
#map .cc-dot{width:13px;height:13px;border-radius:50%;background:#A52A32;border:2px solid #fff;box-sizing:border-box}
.popup{width:228px}.popup img{width:128px;height:68px;object-fit:contain;display:block;background:#e7ebef;margin:0 auto 8px}.pbody{padding:10px 12px 12px}.pcat{font-size:11px;color:#A52A32;font-weight:bold;letter-spacing:.7px;text-transform:uppercase;margin-bottom:4px}.ptitle{font-size:18px;line-height:1.2;color:var(--navy);font-weight:700}.pmeta{font-size:14px;line-height:18px;color:#3F4B57;margin-top:6px}.plink{display:inline-block;margin-top:9px;color:var(--navy);font-size:14px;text-decoration:none}.leaflet-popup-content{margin:0!important;width:228px!important}.leaflet-popup-content-wrapper{padding:0;overflow:visible;border:1px solid #E2E5E8;border-radius:10px;box-shadow:0 4px 14px rgba(24,33,43,.14)}.leaflet-popup-tip{background:#fff}
@media(max-width:640px){
 .panel{top:7px;left:7px;right:7px;transform:none;width:auto;max-width:none;padding:10px;border-radius:9px;max-height:44vh;overflow-y:auto;overscroll-behavior:contain}
 .row{grid-template-columns:minmax(0,1fr) 112px;gap:6px}
 .row input,.row select{height:42px;font-size:12px;padding:0 8px}
 .cats{gap:6px;margin-top:7px;max-height:84px;overflow-y:auto;align-content:flex-start;padding:0 1px 3px}
 .cat{height:32px;padding:0 8px;font-size:11px}
 .popup{width:190px}.leaflet-popup-content{width:190px!important}
 .popup img{width:118px;height:63px}.ptitle{font-size:15px}
 .pmeta,.plink{font-size:12px;line-height:16px}
 #map .leaflet-top.leaflet-left{width:82px}
 #map .leaflet-control-zoom{width:82px}
}
@media(max-width:380px){
 .panel{max-height:47vh;padding:8px}
 .row{grid-template-columns:minmax(0,1fr) 100px}
 .cat{font-size:10px;padding:0 7px}
}
@media(max-width:380px){.panel{max-height:47vh;padding:8px}.head{align-items:flex-start}h1{font-size:15px}.total{font-size:11px}.row{grid-template-columns:minmax(0,1fr) 100px}.cat{font-size:10px;padding:0 7px}}

/* Fullscreen-knop onder de zoomknoppen */
#map .leaflet-control-fullscreen a{
 display:block;width:30px;height:30px;line-height:30px;text-align:center;
 color:#224576!important;background:#fff;text-decoration:none;font-size:20px;
 font-weight:600;border-top:1px solid #D7DEE7;
}
#map .leaflet-control-fullscreen a:hover{background:#f4f6f8}
#map .leaflet-control-fullscreen{border:1px solid #D7DEE7;border-radius:7px;overflow:hidden;box-shadow:0 1px 5px #18345120}
#map .leaflet-bottom.leaflet-left{bottom:24px;left:14px}
@media(max-width:640px){#map .leaflet-bottom.leaflet-left{bottom:22px;left:10px}}

/* Zoomknoppen rechtsboven */
#map .leaflet-top.leaflet-right{top:14px;right:14px}
#map .leaflet-control-zoom{border:1px solid #D7DEE7!important;border-radius:7px;overflow:hidden;box-shadow:0 1px 5px #18345120}
#map .leaflet-control-zoom a{color:#224576!important}
@media(max-width:640px){#map .leaflet-top.leaflet-right{top:10px;right:10px}}
</style></head><body>
<div id="map"></div><div class="panel"><div class="row"><input id="q" placeholder="Zoek op plaatsnaam" type="search"><select id="country"><option value="all">Alle landen</option><option value="nl">Nederland</option><option value="abroad">Buitenland</option></select></div><div class="cats" id="cats"></div></div>
<div class="count" id="count">Kaart laden…</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script>
const URL='https://raw.githubusercontent.com/coldcasezaken/map/main/cases.json';
const C={'Moord':'#E34B4B','Vermissing':'#258ACB','Onbekende doden':'#71879B','Overige':'#A16BD0','Nog controleren':'#D28A32'};
const map=L.map('map',{zoomControl:false,preferCanvas:true,minZoom:2,maxZoom:18,zoomSnap:.5}).setView([52.15,5.30],7.5);

L.control.zoom({position:'topright'}).addTo(map);
const FullscreenControl=L.Control.extend({
 onAdd:function(){
  const wrap=L.DomUtil.create('div','leaflet-control-fullscreen leaflet-bar');
  const a=L.DomUtil.create('a','',wrap);
  a.href='#';a.title='Volledig scherm';a.setAttribute('aria-label','Volledig scherm');a.textContent='⛶';
  L.DomEvent.disableClickPropagation(wrap);
  L.DomEvent.on(a,'click',function(e){
   L.DomEvent.preventDefault(e);
   if(!document.fullscreenElement){
    const target=document.documentElement;
    if(target.requestFullscreen)target.requestFullscreen().catch(()=>{});
   }else if(document.exitFullscreen){document.exitFullscreen();}
  });
  document.addEventListener('fullscreenchange',()=>{
   const active=!!document.fullscreenElement;
   a.title=active?'Volledig scherm verlaten':'Volledig scherm';
   a.setAttribute('aria-label',a.title);
   a.textContent=active?'×':'⛶';
   setTimeout(()=>map.invalidateSize(),100);
  });
  return wrap;
 }
});
const fullscreenControl=new FullscreenControl({position:'topright'});
map.addControl(fullscreenControl);
// Verberg de fullscreenknop zolang de navigatie-/filterbalk eroverheen valt.
(function(){
 const control=fullscreenControl.getContainer();
 const panel=document.querySelector('.panel');
 if(!control)return;
 function updateFullscreenVisibility(){
  if(!panel){control.style.visibility='visible';control.style.pointerEvents='auto';return;}
  const c=control.getBoundingClientRect();
  const p=panel.getBoundingClientRect();
  const overlaps=c.right>p.left&&c.left<p.right&&c.bottom>p.top&&c.top<p.bottom;
  control.style.visibility=overlaps?'hidden':'visible';
  control.style.pointerEvents=overlaps?'none':'auto';
 }
 const schedule=()=>requestAnimationFrame(updateFullscreenVisibility);
 window.addEventListener('resize',schedule);
 map.on('move zoom moveend zoomend',schedule);
 if(window.ResizeObserver){
  const ro=new ResizeObserver(schedule);
  ro.observe(panel);
 }
 if(window.MutationObserver){
  const mo=new MutationObserver(schedule);
  mo.observe(panel,{childList:true,subtree:true,attributes:true,characterData:true});
 }
 schedule();
})();






L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap contributors',maxZoom:19}).addTo(map);
const group=L.markerClusterGroup({showCoverageOnHover:false,spiderfyOnMaxZoom:true,zoomToBoundsOnClick:true,maxClusterRadius:42,disableClusteringAtZoom:13,animate:true,animateAddingMarkers:false,iconCreateFunction:function(cluster){const n=cluster.getChildCount(),cls=n<10?'cluster-small':(n<30?'cluster-medium':'cluster-large'),size=n<10?38:(n<30?50:65);return L.divIcon({html:'<div>'+n+'</div>',className:'marker-cluster '+cls,iconSize:[size,size]})}});map.addLayer(group);
let data=[],cat='all',country='all',q='';
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));
function year(c){let n=Number(c.year)||Number((String(c.title||'').match(/\b(?:19|20)\d{2}\b/)||[])[0]);return n>0?n:null}
function abroad(c){const lat=Number(c.lat),lng=Number(c.lng);return !(Number.isFinite(lat)&&Number.isFinite(lng)&&lat>=50.7&&lat<=53.8&&lng>=3.2&&lng<=7.3)}
function category(c){return c.category||'Overige'}
function visible(c){return (cat==='all'||category(c)===cat)&&(country==='all'||(country==='abroad')===abroad(c))&&(!q||(String(c.title||'')+' '+String(c.geoPlace||'')).toLocaleLowerCase('nl').includes(q))}
function popup(c){return '<div class="popup">'+(c.image?'<img src="'+esc(c.image)+'" alt="">':'')+'<div class="pbody"><div class="pcat">'+esc(category(c))+'</div><div class="ptitle">'+esc(c.title)+'</div><div class="pmeta">'+esc(c.geoPlace||'')+(year(c)?' · '+year(c):'')+'</div>'+(c.link?'<a class="plink" target="_blank" rel="noopener" href="'+esc(c.link)+'">Bekijk dossier »</a>':'')+'</div></div>'}
function draw(){group.clearLayers();let arr=data.filter(visible);arr.forEach(c=>{let lat=+c.lat,lng=+c.lng;if(!Number.isFinite(lat)||!Number.isFinite(lng))return;let m=L.marker([lat,lng],{icon:L.divIcon({className:'',html:'<div class="cc-dot"></div>',iconSize:[16,16],iconAnchor:[8,8]})});m.bindPopup(popup(c),{maxWidth:228,minWidth:170,closeButton:false});group.addLayer(m)});$('count').textContent=arr.length+' van '+data.length+' zaken';renderCats()}
async function searchPlace(){
 const raw=$('q').value.trim();if(!raw)return;
 const status=$('count');status.textContent='Plaats zoeken…';
 try{
  const url='https://nominatim.openstreetmap.org/search?format=jsonv2&addressdetails=1&limit=1&accept-language=nl&q='+encodeURIComponent(raw);
  const res=await fetch(url,{headers:{'Accept':'application/json'}});
  if(!res.ok)throw new Error('Geocoder HTTP '+res.status);
  const results=await res.json();
  if(!results.length){status.textContent='Geen plaats gevonden';return}
  const hit=results[0],lat=Number(hit.lat),lon=Number(hit.lon),cc=String(hit.address?.country_code||'').toLowerCase();
  if(!Number.isFinite(lat)||!Number.isFinite(lon)){status.textContent='Geen geldige locatie gevonden';return}
  // A place search starts a fresh geographic view: clear text/category constraints.
  q='';$('q').value='';cat='all';
  if(cc==='nl')country='nl';else if(cc)country='abroad';else country='all';
  $('country').value=country;
  draw();
  map.setView([lat,lon],Math.max(map.getZoom(),11));
  status.textContent='Kaart verplaatst naar '+(hit.name||raw);
 }catch(err){
  console.error(err);
  status.textContent='Plaats zoeken mislukt – probeer opnieuw';
 }
}
function inLocationScope(c){
 const lat=Number(c.lat),lng=Number(c.lng);
 if(!Number.isFinite(lat)||!Number.isFinite(lng))return false;
 if(country!=='all'&&((country==='abroad')!==abroad(c)))return false;
 if(q&&!((String(c.title||'')+' '+String(c.geoPlace||'')).toLocaleLowerCase('nl').includes(q)))return false;
 return map.getBounds().contains([lat,lng]);
}
function renderCats(){
 const counts={};
 data.forEach(c=>{
  if(!inLocationScope(c))return;
  const k=category(c);counts[k]=(counts[k]||0)+1;
 });
 const keys=['all',...Object.keys(C).filter(k=>counts[k]!==undefined),...Object.keys(counts).filter(k=>!C[k]).sort()];
 const total=Object.values(counts).reduce((a,b)=>a+b,0);
 $('cats').innerHTML=keys.map(k=>{
  const label=k==='all'?'Alle categorieën':k,col=C[k]||'#224576',n=k==='all'?total:(counts[k]||0);
  return '<button class="cat '+(cat===k?'active':'')+'" data-k="'+esc(k)+'"><span class="dot"></span>'+esc(label)+' <span class="n">'+n+'</span></button>'
 }).join('')+'<div class="total" id="total">'+data.length+' zaken</div>';
 $('cats').querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{cat=b.dataset.k;draw()});
}
// Houd marker-popups vrij van het zwevende filterpaneel boven de kaart.
map.on('popupopen',function(e){
 setTimeout(function(){
  const panel=document.querySelector('.panel');
  const popup=e.popup&&e.popup.getElement?e.popup.getElement():null;
  const mapBox=map.getContainer();
  if(!panel||!popup||!mapBox)return;
  const p=panel.getBoundingClientRect();
  const b=popup.getBoundingClientRect();
  const m=mapBox.getBoundingClientRect();
  const horizontalOverlap=b.right>m.left&&b.left<m.right;
  const covered=b.top<p.bottom&&b.bottom>p.top&&horizontalOverlap;
  if(covered){
   const shift=p.bottom-b.top+16;
   map.panBy([0,-shift],{animate:true,duration:0.25});
  }
 },100);
});
map.on('moveend zoomend',()=>{renderCats();});
$('q').oninput=e=>{q=e.target.value.trim().toLocaleLowerCase('nl');draw()};$('q').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();searchPlace()}});$('country').onchange=e=>{
 country=e.target.value;q='';$('q').value='';cat='all';draw();
 if(country==='abroad'){
  // Buitenland toont bewust de wereldkaart; niet inzoomen op één uiterste buitenlandse marker.
  map.fitBounds([[-55,-170],[75,180]],{padding:[20,20],maxZoom:2});
 }else if(country==='nl'){
  const pts=data.filter(c=>!abroad(c)).filter(c=>Number.isFinite(+c.lat)&&Number.isFinite(+c.lng)).map(c=>[+c.lat,+c.lng]);
  if(pts.length)map.fitBounds(L.latLngBounds(pts).pad(.12),{maxZoom:8});
  else map.setView([52.15,5.30],7.5);
 }else map.setView([52.15,5.30],7.5);
};
fetch(URL).then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).then(d=>{
 data=Array.isArray(d)?d:[];
 const krisId='kris-kremers-lisanne-froon';
 if(!data.some(c=>c.id===krisId)){
  data.push({
   lat:8.833683,lng:-82.426167,
   title:'De mysterieuze dood van Kris Kremers en Lisanne Froon - Panama 2014',
   link:'https://www.coldcasezaken.nl/kris-kremers-en-lisanne-froon',
   id:krisId,geoPlace:'Boquete',category:'Overige',
   image:'https://primary.jwwb.nl/public/t/l/i/temp-bqjoudxtrdpcquxbogqx/kremersfroonthumbsup-high.webp',
   year:2014
  });
 }
 draw();map.setView([52.15,5.30],7.5)
}).catch(e=>{$('count').textContent='Gegevens niet geladen';console.error(e)});
</script></body></html>
