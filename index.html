<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Coldcase Kaart</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
  <style>
    html,body{margin:0;padding:0;width:100%;height:100%;}
    #map{height:100vh;width:100%;}
    .marker-cluster{background:transparent!important;}
    .marker-cluster div{
      color:#fff!important;
      font-weight:600!important;
      border-radius:50%!important;
      border:2px solid rgba(63,110,88,.55)!important;
      box-shadow:0 2px 7px rgba(34,69,118,.16)!important;
      text-align:center!important;
    }
    .cluster-small div{background:#7E9F8B!important;width:34px!important;height:34px!important;line-height:30px!important;}
    .cluster-medium div{background:#5F866F!important;width:40px!important;height:40px!important;line-height:36px!important;}
    .cluster-large div{background:#3F6E58!important;width:48px!important;height:48px!important;line-height:44px!important;}
    .cc-dot{width:16px;height:16px;border-radius:50%;background:#C5322C;border:2px solid #fff;box-shadow:0 2px 7px rgba(34,69,118,.28);box-sizing:border-box;}
  </style>
</head>
<body>
<div id="map"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script>
var map=L.map('map').setView([52.1,5.1],7);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap contributors'}).addTo(map);
function clusterClass(n){return n<10?'cluster-small':(n<30?'cluster-medium':'cluster-large');}
var clusters=L.markerClusterGroup({
  showCoverageOnHover:false,
  spiderfyOnMaxZoom:true,
  zoomToBoundsOnClick:true,
  maxClusterRadius:45,
  iconCreateFunction:function(cluster){
    var n=cluster.getChildCount();
    return L.divIcon({html:'<div>'+n+'</div>',className:'marker-cluster '+clusterClass(n),iconSize:[n<10?34:n<30?40:48,n<10?34:n<30?40:48]});
  }
});
fetch('cases.json').then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json();}).then(function(cases){
  cases.forEach(function(c){
    var icon=L.divIcon({className:'',html:'<div class="cc-dot"></div>',iconSize:[16,16],iconAnchor:[8,8]});
    var marker=L.marker([c.lat,c.lng],{icon:icon});
    marker.bindPopup('<strong>'+String(c.title||'').replace(/</g,'&lt;').replace(/>/g,'&gt;')+'</strong><br><a href="'+c.link+'" target="_blank" rel="noopener">Bekijk dossier</a>');
    clusters.addLayer(marker);
  });
  map.addLayer(clusters);
}).catch(function(err){console.error('Fout bij laden cases.json:',err);});
</script>
</body>
</html>
